name: Cognilode public MCP CUX observation contract probe

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cognilode-public-mcp-cux-skills.yml'
  pull_request:
    branches: [master]
    paths:
      - '.github/everything-revenue-ingress-trigger.txt'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'mcp==1.29.0'
      - name: Restart the existing user Daemon Manager service
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, traceback
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          command='''set -Eeuo pipefail
          echo BEFORE_BEGIN
          systemctl --user show daemon_manager.service --property=ActiveState --property=SubState --property=MainPID --property=ExecMainStartTimestampMonotonic
          echo BEFORE_END
          systemctl --user restart daemon_manager.service
          '''

          async def main():
              async with streamable_http_client('https://mcp.cognilode.com/mcp') as (read,write,_):
                  async with ClientSession(read,write) as session:
                      await session.initialize(); tools=await session.list_tools(); names={t.name for t in tools.tools}
                      if 'multi_tool' not in names: raise RuntimeError(f'multi_tool missing; tools={sorted(names)}')
                      try: await session.call_tool('multi_tool',{'operation':'__skill__','arguments':{'operation':'host.shell.execute'}})
                      except Exception: pass
                      result=await session.call_tool('multi_tool',{'operation':'host.shell.execute','arguments':{'command':command,'cwd':'/home/evan','timeout_seconds':45,'max_output_bytes':65536,'host_user':'evan'}})
                      for part in result.content:
                          text=getattr(part,'text','')
                          if text: print(text)
                      if bool(getattr(result,'isError',False)): raise RuntimeError('restart shell returned isError=true')

          try: asyncio.run(main())
          except BaseException:
              traceback.print_exc()
              # A connection drop is expected when the existing MCP child exits with its manager.
              # The next independent workflow run verifies whether systemd completed the restart.
          PY
