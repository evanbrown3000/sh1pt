name: Cognilode public MCP CUX observation contract probe

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cognilode-public-mcp-cux-skills.yml'
  pull_request:
    branches: [master]
    paths:
      - '.github/everything-revenue-ingress-trigger.txt'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'mcp==1.29.0'
      - name: Execute one current revenue delegation through the existing public MCP owner
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, json, traceback
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          command = r'''set -Eeuo pipefail
          export HOME=/home/evan
          PY=/home/evan/.local/share/live/worlds/v1/runtime/venv/bin/python
          test -x "$PY"
          "$PY" - <<'PYH'
          from __future__ import annotations
          import hashlib, json, pathlib, sys, time, urllib.request
          CORR='everything-revenue-front-1dade875-d140-4eb7-92b2-0e3651e694be'
          NONCE='a3a26d03-3294-4d71-a0c7-73c72b3394b4'
          for path in (
              '/home/evan/Projects/static_and_singular/internal_sub_projects/ecr_email/src',
              '/home/evan/Projects/worlds/v1/cognilode/internal_sub_projects/autonomy_core/internal_sub_projects/employee/src',
              '/home/evan/Projects/static_and_singular/internal_sub_projects/contracts_commands_and_tools/src',
              '/home/evan/Projects/static_and_singular/internal_sub_projects/secretary/src',
              '/home/evan/Projects/static_and_singular/internal_sub_projects/persona_sot/src',
              '/home/evan/Projects/static_and_singular/internal_sub_projects/daemon_manager/src',
              '/home/evan/Projects/static_and_singular/src',
          ):
              if path not in sys.path: sys.path.insert(0,path)
          result={'schema':'everything.revenue.public_mcp_ingress.v1','correlation_id':CORR,'manager_nonce':NONCE,'started_at_s':time.time()}
          req=pathlib.Path('/home/evan/.local/share/live/worlds/v1/cognilode/universe/employee_runtime/activation_requests/employee_cognilode.json')
          def read_req():
              try:
                  x=json.loads(req.read_text()) if req.exists() else {}
                  return x if isinstance(x,dict) else {}
              except Exception as exc: return {'read_error':f'{type(exc).__name__}: {exc}'}
          def compact(x):
              return {k:x.get(k) for k in ('request_id','correlation_id','state','attempts','submission_observed','response_started','transport_status','transport_attempt_state','last_error','next_attempt_at_s')}
          before=read_req(); result['activation_before']=compact(before)
          try:
              from ecr_email.daemon import _domain_root
              from ecr_email.poll import poll_all_once
              from ecr_email.material_delegation import stage_and_delegate
              root=_domain_root()
              polled=poll_all_once(root=root,persist=True,limit=100)
              material=dict(polled.get('material_watch') or {})
              emitted=[dict(x) for x in material.get('emitted') or () if isinstance(x,dict)]
              delegated=stage_and_delegate(emitted,root=root)
              result['ecr']={'new_count':polled.get('new_count'),'material_emitted_count':len(emitted),'delegation_status':delegated.get('status'),'delegation_state':delegated.get('state'),'delegated_count':delegated.get('delegated_count'),'pending_count':delegated.get('pending_count')}
          except Exception as exc:
              result['ecr_exception']=f'{type(exc).__name__}: {exc}'
          current=read_req()
          if current.get('correlation_id')!=CORR:
              try:
                  from employee_runtime.employee_comms_public import send
                  activation=send(
                      recipient='cognilode',
                      message=(
                          'Process the exact private ECR material transition correlation '+CORR+'. '
                          'Consume the two internal Gmail custody messages carrying that correlation; '
                          'execute the required Cognilode→Business provider lifecycle, preserve every single-flight '
                          'and ticket-fingerprint guard in those private messages, and return terminally to Everything. '
                          'This is AI/manager-authored continuation, not Evan-authored text. Do not stop at a queue receipt.'
                      ),
                      sender='everything',
                      repo_root='/home/evan/Projects/worlds/v1/cognilode/internal_sub_projects/autonomy_core/internal_sub_projects/employee',
                      correlation_id=CORR,
                      message_kind='prompt',priority='high',activation='interrupt_now',requires_return=True,
                      activation_custody={'kickoff_id':'final-kickoff-20260817T1938CT','manager_nonce':NONCE,'workstream':'revenue','origin_class':'EMPLOYEE_AUTONOMOUS','private_ecr_material_ids':['1a0129e725a0cca0','1a0129ec0c7e4f30']},
                  )
                  result['activation_send']={k:activation.get(k) for k in ('status','request_id','trigger_requested','submission_observed','response_started')}
              except Exception as exc:
                  result['activation_send_exception']=f'{type(exc).__name__}: {exc}'
          else:
              result['activation_send']={'status':'existing_exact_correlation_preserved','request_id':current.get('request_id')}
          try:
              from employee_runtime.daemon import poll_once
              polls=[]
              for _ in range(3):
                  value=poll_once(repo_root='/home/evan/Projects/worlds/v1/cognilode/internal_sub_projects/autonomy_core/internal_sub_projects/employee',daemon_name='employee_runtime-everything-public-mcp-ingress')
                  polls.append({k:value.get(k) for k in ('status','activation_attempted_count','activation_succeeded_count','activation_failed_count','deferred_comms_triggered_count','deferred_comms_waiting_count')})
                  time.sleep(4)
              result['employee_polls']=polls
          except Exception as exc:
              result['employee_poll_exception']=f'{type(exc).__name__}: {exc}'
          try:
              import websocket
              deadline=time.time()+120
              observed=None
              while time.time()<deadline:
                  with urllib.request.urlopen('http://127.0.0.1:9331/json/list',timeout=3) as response: pages=json.load(response)
                  for page in pages:
                      if page.get('type')!='page' or not page.get('webSocketDebuggerUrl'): continue
                      try:
                          ws=websocket.create_connection(page['webSocketDebuggerUrl'],timeout=3,suppress_origin=True)
                          expr=r'''JSON.stringify({m:Array.from(document.querySelectorAll('[data-message-author-role]')).map((e,i)=>({i,r:e.getAttribute('data-message-author-role'),t:(e.innerText||'').trim()})).filter(x=>x.t),g:!!document.querySelector('button[data-testid="stop-button"],button[aria-label*="Stop" i]'),rl:/too many requests|temporarily limited access|requests are being made too quickly/i.test(document.body.innerText||'')})'''
                          ws.send(json.dumps({'id':1,'method':'Runtime.evaluate','params':{'expression':expr,'returnByValue':True}}))
                          raw=None
                          for _ in range(20):
                              msg=json.loads(ws.recv())
                              if msg.get('id')==1: raw=msg; break
                          ws.close()
                          value=json.loads(((((raw or {}).get('result') or {}).get('result') or {}).get('value')) or '{}')
                      except Exception: continue
                      messages=value.get('m') if isinstance(value.get('m'),list) else []
                      indexes=[i for i,x in enumerate(messages) if CORR in str(x.get('t') or '')]
                      if not indexes: continue
                      i=indexes[-1]; assistants=[x for x in messages[i+1:] if x.get('r')=='assistant']
                      observed={'provider_user_observed':True,'provider_user_sha256':hashlib.sha256(str(messages[i].get('t') or '').encode()).hexdigest(),'provider_user_chars':len(str(messages[i].get('t') or '')),'generation_visible':bool(value.get('g')),'rate_limited':bool(value.get('rl')),'assistant_after_count':len(assistants),'assistant_first_sha256':hashlib.sha256(str((assistants[0] if assistants else {}).get('t') or '').encode()).hexdigest() if assistants else None,'assistant_first_chars':len(str((assistants[0] if assistants else {}).get('t') or '')) if assistants else 0,'terminal_assistant_observed':bool(assistants and not value.get('g') and str(assistants[0].get('t') or '').strip())}
                      if observed['rate_limited'] or observed['terminal_assistant_observed'] or observed['generation_visible']: break
                  if observed: break
                  time.sleep(8)
              result['provider_observation']=observed or {'provider_user_observed':False}
          except Exception as exc:
              result['provider_observation_exception']=f'{type(exc).__name__}: {exc}'
          result['activation_after']=compact(read_req())
          result['ended_at_s']=time.time()
          print(json.dumps(result,sort_keys=True,default=str))
          PYH
          '''

          async def main():
              async with streamable_http_client('https://mcp.cognilode.com/mcp') as (read,write,_):
                  async with ClientSession(read,write) as session:
                      await session.initialize()
                      tools=await session.list_tools()
                      names={tool.name for tool in tools.tools}
                      if 'multi_tool' not in names:
                          raise RuntimeError(f'multi_tool missing; tools={sorted(names)}')
                      try:
                          await session.call_tool('multi_tool',{'operation':'__skill__','arguments':{'operation':'host.shell.execute'}})
                      except Exception:
                          pass
                      result=await session.call_tool('multi_tool',{
                          'operation':'host.shell.execute',
                          'arguments':{'command':command,'cwd':'/home/evan','timeout_seconds':165,'max_output_bytes':262144,'host_user':'evan'},
                      })
                      failed=bool(getattr(result,'isError',False))
                      for part in result.content:
                          text=getattr(part,'text','')
                          if text: print(text)
                      if failed: raise RuntimeError('host tool returned isError=true')
          try:
              asyncio.run(main())
          except BaseException:
              traceback.print_exc()
              raise
          PY
