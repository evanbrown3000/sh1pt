name: Cognilode public MCP CUX observation contract probe

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cognilode-public-mcp-cux-skills.yml'
      - '.github/recovery/loaded_adoption_preflight.py'
  pull_request:
    branches: [master]
    paths:
      - '.github/everything-revenue-ingress-trigger.txt'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'mcp==1.29.0'
      - name: Read exact selected-world restart failure through the existing public MCP owner
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, traceback
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client
          command = '''set -Eeuo pipefail
          work=$(mktemp -d /tmp/adoption-restart-evidence.XXXXXX)
          trap 'rm -rf "$work"' EXIT
          curl -fsSL --retry 2 --connect-timeout 10 https://raw.githubusercontent.com/evanbrown3000/sh1pt/d967f91e6895633e7ca28948369b75e8b1e02c90/.github/recovery/loaded_adoption_preflight.py -o "$work/read.py"
          chmod 700 "$work/read.py"
          /home/evan/.local/share/live/worlds/v1/runtime/venv/bin/python "$work/read.py"
          '''
          async def main():
              async with streamable_http_client('https://mcp.cognilode.com/mcp') as (read,write,_):
                  async with ClientSession(read,write) as session:
                      await session.initialize(); tools=await session.list_tools(); names={t.name for t in tools.tools}
                      if 'multi_tool' not in names: raise RuntimeError(f'multi_tool missing; tools={sorted(names)}')
                      try: await session.call_tool('multi_tool',{'operation':'__skill__','arguments':{'operation':'host.shell.execute'}})
                      except Exception: pass
                      result=await session.call_tool('multi_tool',{'operation':'host.shell.execute','arguments':{'command':command,'cwd':'/home/evan','timeout_seconds':80,'max_output_bytes':262144,'host_user':'evan'}})
                      for part in result.content:
                          text=getattr(part,'text','')
                          if text: print(text)
                      if bool(getattr(result,'isError',False)): raise RuntimeError('host tool returned isError=true')
          try: asyncio.run(main())
          except BaseException: traceback.print_exc(); raise
          PY
