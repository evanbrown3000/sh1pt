name: Cognilode current Business provider capability probe

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cognilode-public-mcp-cux-skills.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'mcp==1.29.0'
      - name: Discover current Business/provider owner operations
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, json
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          NEEDLES = ('business', 'ugig', 'marketplace', 'provider', 'cash', 'settlement', 'autoyt', 'website', 'host.shell.execute')

          def decode(result):
              for part in result.content:
                  text = getattr(part, 'text', '')
                  if not text:
                      continue
                  try:
                      obj = json.loads(text)
                  except Exception:
                      continue
                  if isinstance(obj, dict):
                      return obj.get('result', obj)
              return {}

          async def main():
              async with streamable_http_client('https://mcp.cognilode.com/mcp') as (read, write, _):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      result = await session.call_tool('multi_tool', {'operation':'capabilities.catalog','arguments':{}})
                      catalog = decode(result)
                      rows = []
                      for row in catalog.get('operations', []) if isinstance(catalog, dict) else []:
                          name = str(row.get('semantic_operation') or '')
                          desc = str(row.get('description') or '')
                          hay = (name + ' ' + desc).lower()
                          if any(n in hay for n in NEEDLES):
                              rows.append({
                                  'operation': name,
                                  'owner': row.get('semantic_owner'),
                                  'read_only': row.get('read_only'),
                                  'nonblocking': row.get('nonblocking'),
                                  'description': desc[:240],
                              })
                      print(json.dumps({'bridge':'ok','matches':rows}, sort_keys=True))
          asyncio.run(main())
          PY
