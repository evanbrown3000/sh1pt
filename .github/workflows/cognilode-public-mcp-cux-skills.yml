name: Cognilode public MCP CUX observation contract probe

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cognilode-public-mcp-cux-skills.yml'
      - '.github/recovery/loaded_adoption_preflight.py'
  pull_request:
    branches: [master]
    paths:
      - '.github/everything-revenue-ingress-trigger.txt'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'mcp==1.29.0'
      - name: Execute concise fresh selected-world preflight through the existing public MCP owner
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, base64, pathlib, traceback
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          source = pathlib.Path('.github/recovery/loaded_adoption_preflight.py').read_bytes()
          encoded = base64.b64encode(source).decode('ascii')
          command = f'''set -Eeuo pipefail
          work=$(mktemp -d /tmp/loaded-adoption-preflight.XXXXXX)
          trap 'rm -rf "$work"' EXIT
          printf %s {encoded!r} | base64 -d > "$work/preflight.py"
          chmod 700 "$work/preflight.py"
          py=/home/evan/.local/share/live/worlds/v1/runtime/venv/bin/python
          test -x "$py"
          "$py" "$work/preflight.py"
          '''

          async def main():
              async with streamable_http_client('https://mcp.cognilode.com/mcp') as (read, write, _):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      tools = await session.list_tools()
                      names = {tool.name for tool in tools.tools}
                      if 'multi_tool' not in names:
                          raise RuntimeError(f'multi_tool missing; tools={sorted(names)}')
                      try:
                          await session.call_tool('multi_tool', {
                              'operation': '__skill__',
                              'arguments': {'operation': 'host.shell.execute'},
                          })
                      except Exception:
                          pass
                      result = await session.call_tool('multi_tool', {
                          'operation': 'host.shell.execute',
                          'arguments': {
                              'command': command,
                              'cwd': '/home/evan',
                              'timeout_seconds': 80,
                              'max_output_bytes': 262144,
                              'host_user': 'evan',
                          },
                      })
                      failed = bool(getattr(result, 'isError', False))
                      for part in result.content:
                          text = getattr(part, 'text', '')
                          if text:
                              print(text)
                      if failed:
                          raise RuntimeError('host tool returned isError=true')

          try:
              asyncio.run(main())
          except BaseException:
              traceback.print_exc()
              raise
          PY
