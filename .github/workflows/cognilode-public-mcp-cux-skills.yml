name: Cognilode public MCP CUX observation contract probe

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cognilode-public-mcp-cux-skills.yml'
  pull_request:
    branches: [master]
    paths:
      - '.github/everything-revenue-ingress-trigger.txt'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'mcp==1.29.0'
      - name: Restart the existing Daemon Manager through its owner-native operation
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, json, traceback
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          async def main():
              async with streamable_http_client('https://mcp.cognilode.com/mcp') as (read,write,_):
                  async with ClientSession(read,write) as session:
                      await session.initialize(); tools=await session.list_tools(); names={t.name for t in tools.tools}
                      if 'multi_tool' not in names: raise RuntimeError(f'multi_tool missing; tools={sorted(names)}')
                      skill=await session.call_tool('multi_tool',{'operation':'__skill__','arguments':{'operation':'daemon_manager.process.restart'}})
                      for part in skill.content:
                          text=getattr(part,'text','')
                          if text: print('SKILL',text)
                      result=await session.call_tool('multi_tool',{'operation':'daemon_manager.process.restart','arguments':{'daemon_name':'daemon_manager'}})
                      for part in result.content:
                          text=getattr(part,'text','')
                          if text: print('RESTART',text)
                      if bool(getattr(result,'isError',False)): raise RuntimeError('restart operation returned isError=true')

          try: asyncio.run(main())
          except BaseException: traceback.print_exc(); raise
          PY
