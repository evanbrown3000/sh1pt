name: Cognilode CUX Qmee classify current

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cognilode-cux-qmee-observe.yml'

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'mcp==1.29.0'
      - name: Classify current Qmee page through one existing CUX lease
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, json
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          def decode(result):
              for part in result.content:
                  text=getattr(part,'text','')
                  if not text: continue
                  try:
                      obj=json.loads(text)
                      return obj.get('result', obj) if isinstance(obj,dict) else obj
                  except Exception:
                      continue
              return {}

          def walk(obj):
              if isinstance(obj,dict):
                  yield obj
                  for v in obj.values(): yield from walk(v)
              elif isinstance(obj,list):
                  for v in obj: yield from walk(v)

          async def raw(session, op, args=None):
              return await session.call_tool('multi_tool', {'operation':op,'arguments':args or {}})

          async def call(session, op, args=None):
              return decode(await raw(session,op,args))

          def pick_lease(sessions):
              rows=list(walk(sessions))
              live99=any(str(r.get('display') or '')==':99' and (r.get('active') is True or r.get('alive') is True or str(r.get('state') or '').lower() in {'running','active','live'}) for r in rows)
              if not live99: raise RuntimeError('no live :99 CUX application session')
              leases=[]
              for r in rows:
                  lease=str(r.get('lease_id') or '').strip()
                  if lease and lease not in leases: leases.append(lease)
              if len(leases)!=1: raise RuntimeError(f'expected one unique application lease, observed {len(leases)}')
              return leases[0]

          async def expect(session, lease, text):
              r=await raw(session,'computerusex.form.expect',{'lease_id':lease,'text':text,'wait_seconds':1.5})
              return not bool(getattr(r,'isError',False))

          async def main():
              async with streamable_http_client('https://mcp.cognilode.com/mcp') as (read, write, _):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      lease=pick_lease(await call(session,'computerusex.tools.sessions'))
                      markers={}
                      for text in ['My Qmee','Surveys','Cash out','Cashback','Deals','Gaming','Log in to your account','Log in','Sign up for free','Sign Up','Your balance','PayPal','Venmo']:
                          try: markers[text]=await expect(session,lease,text)
                          except Exception: markers[text]=False
                      login=markers['Log in to your account'] or markers['Log in']
                      account=markers['My Qmee'] or markers['Surveys'] or markers['Cash out'] or markers['Cashback'] or markers['Deals'] or markers['Gaming'] or markers['Your balance']
                      print(json.dumps({
                          'authenticated_qmee': bool(account and not login),
                          'cashout_visible': bool(markers['Cash out']),
                          'balance_label_visible': bool(markers['Your balance']),
                          'paypal_visible': bool(markers['PayPal']),
                          'venmo_visible': bool(markers['Venmo']),
                          'survey_inventory_visible': bool(markers['Surveys']),
                          'cashback_visible': bool(markers['Cashback']),
                          'deals_visible': bool(markers['Deals']),
                          'gaming_visible': bool(markers['Gaming']),
                          'login_surface_visible': bool(login),
                          'signup_surface_visible': bool(markers['Sign up for free'] or markers['Sign Up']),
                          'reused_existing_application_lease': True,
                          'navigation_replayed': False,
                      }, sort_keys=True))
          asyncio.run(main())
          PY
