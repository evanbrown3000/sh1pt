name: Cognilode CUX Qmee reconcile

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cognilode-cux-qmee-observe.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'mcp==1.29.0'
      - name: Reconcile prior Qmee navigation postcondition read-only
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, json
          from urllib.parse import urlparse
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          def decode(result):
              for part in result.content:
                  text=getattr(part,'text','')
                  if not text: continue
                  try:
                      obj=json.loads(text)
                      return obj.get('result', obj) if isinstance(obj,dict) else obj
                  except Exception:
                      continue
              return {}

          def walk(obj):
              if isinstance(obj,dict):
                  yield obj
                  for v in obj.values(): yield from walk(v)
              elif isinstance(obj,list):
                  for v in obj: yield from walk(v)

          async def call(session, op, args=None):
              r=await session.call_tool('multi_tool', {'operation':op,'arguments':args or {}})
              return decode(r)

          def urls(obj):
              out=[]
              for row in walk(obj):
                  for k,v in row.items():
                      if isinstance(v,str) and k.lower() in {'url','last_url','current_url'} and v.startswith(('http://','https://')):
                          out.append(v)
              return out

          async def main():
              async with streamable_http_client('https://mcp.cognilode.com/mcp') as (read, write, _):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      sessions=await call(session,'computerusex.tools.sessions')
                      windows=await call(session,'computerusex.tools.browser_windows')
                      status=await call(session,'computerusex.tools.status')
                      rows=list(walk(sessions))
                      live99=any(str(r.get('display') or '')==':99' and (r.get('active') is True or r.get('alive') is True or str(r.get('state') or '').lower() in {'running','active','live'}) for r in rows)
                      leases=[]
                      categories=[]
                      for r in rows:
                          lease=str(r.get('lease_id') or '').strip()
                          if lease and lease not in leases:
                              leases.append(lease)
                              if lease.startswith('cux-public-'): cat='public'
                              elif lease.startswith('business-'): cat='business'
                              else: cat='other'
                              if cat not in categories: categories.append(cat)
                      hosts=[]
                      for u in urls(sessions)+urls(windows):
                          try: h=(urlparse(u).hostname or '').lower()
                          except Exception: h=''
                          if h and h not in hosts: hosts.append(h)
                      qmee=any(h=='qmee.com' or h.endswith('.qmee.com') for h in hosts)
                      print(json.dumps({
                          'live_application_display_99': live99,
                          'unique_lease_count': len(leases),
                          'lease_categories': categories,
                          'managed_hostnames': hosts[:20],
                          'qmee_postcondition_present': qmee,
                          'status_available': bool(status),
                      }, sort_keys=True))
          asyncio.run(main())
          PY
