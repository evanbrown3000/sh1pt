name: Cognilode CUX current cash-provider executor

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cognilode-cux-qmee-observe.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'mcp==1.29.0'
      - name: Act on current provider in one MCP session without navigation
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, json
          from urllib.parse import urlparse
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          PROVIDERS={
              'qmee.com': {'id':'qmee','login':['Log in','Log in to your account'],'account':['My Qmee','Surveys','Cashback','Deals'],'cashout':['Cash out']},
              'primeopinion.com': {'id':'prime_opinion','login':['Log in'],'account':['Rewards','Paid surveys'],'cashout':['Redeem']},
              'fivesurveys.com': {'id':'five_surveys','login':['Log in','Sign up'],'account':['Complete 5 Surveys','balance'],'cashout':['Redeem']},
              'freecash.com': {'id':'freecash','login':['Sign In'],'account':['Earn','Offers','Cashout'],'cashout':['Cashout','Cash out']},
              'attapoll.app': {'id':'attapoll','login':[],'account':['Paid Surveys'],'cashout':[]},
          }

          def decode(r):
              for p in r.content:
                  t=getattr(p,'text','')
                  if not t: continue
                  try:
                      o=json.loads(t); return o.get('result',o) if isinstance(o,dict) else o
                  except Exception: pass
              return {}
          def walk(o):
              if isinstance(o,dict):
                  yield o
                  for v in o.values(): yield from walk(v)
              elif isinstance(o,list):
                  for v in o: yield from walk(v)
          async def raw(s,op,args=None): return await s.call_tool('multi_tool',{'operation':op,'arguments':args or {}})
          async def call(s,op,args=None): return decode(await raw(s,op,args))
          async def expect(s,lease,text,wait=1.0):
              r=await raw(s,'computerusex.form.expect',{'lease_id':lease,'text':text,'wait_seconds':wait})
              return not bool(getattr(r,'isError',False))
          async def click(s,lease,selector,high=False):
              r=await raw(s,'computerusex.form.click',{'lease_id':lease,'selector':selector,'effect_class':'final_submit','allow_submit':True,'allow_high_effect':bool(high)})
              return not bool(getattr(r,'isError',False))
          def lease_of(sessions):
              rows=list(walk(sessions))
              live99=any(str(r.get('display') or '')==':99' and (r.get('active') is True or r.get('alive') is True or str(r.get('state') or '').lower() in {'active','live','running'}) for r in rows)
              if not live99: raise RuntimeError('no live :99 application session; refuse to start another browser')
              xs=[]
              for r in rows:
                  x=str(r.get('lease_id') or '').strip()
                  if x and x not in xs: xs.append(x)
              if len(xs)!=1: raise RuntimeError(f'expected exactly one unique application lease, observed {len(xs)}')
              return xs[0]
          def current_provider(windows):
              hits=[]
              for r in walk(windows):
                  u=str(r.get('url') or '')
                  try: host=(urlparse(u).hostname or '').lower()
                  except Exception: host=''
                  for domain,spec in PROVIDERS.items():
                      if host==domain or host.endswith('.'+domain): hits.append((host,spec))
              uniq=[]
              for host,spec in hits:
                  if spec['id'] not in {x[1]['id'] for x in uniq}: uniq.append((host,spec))
              if len(uniq)!=1: return None, None, len(uniq)
              return uniq[0][0], uniq[0][1], 1

          async def first_marker(s,lease,labels):
              for label in labels:
                  try:
                      if await expect(s,lease,label): return label
                  except Exception: pass
              return ''

          async def main():
              async with streamable_http_client('https://mcp.cognilode.com/mcp') as (rd,wr,_):
                  async with ClientSession(rd,wr) as s:
                      await s.initialize()
                      lease=lease_of(await call(s,'computerusex.tools.sessions',{}))
                      host,spec,count=current_provider(await call(s,'computerusex.tools.browser_windows',{}))
                      if spec is None:
                          print(json.dumps({'provider_count':count,'provider_side_effect':False,'action':'none','reason':'no_single_supported_current_provider'},sort_keys=True)); return

                      # Recheck the provider in this SAME session before each effect; never navigate.
                      cashout=await first_marker(s,lease,spec['cashout'])
                      account=await first_marker(s,lease,spec['account'])
                      login=await first_marker(s,lease,spec['login'])
                      action='observe_only'; effect=False; owner_error=False

                      if cashout:
                          ok=await click(s,lease,'text='+cashout,high=True)
                          action='cashout_open'; effect=True; owner_error=not ok
                          # Advance only provider-native payout controls visible after opening cashout.
                          if ok:
                              paypal=await first_marker(s,lease,['PayPal'])
                              venmo=await first_marker(s,lease,['Venmo'])
                              payout=paypal or venmo
                              if payout:
                                  ok2=await click(s,lease,'text='+payout,high=True)
                                  action='payout_method_select'; effect=True; owner_error=owner_error or (not ok2)
                                  if ok2:
                                      confirm=await first_marker(s,lease,['Confirm','Redeem','Withdraw','Cash out','Cashout'])
                                      if confirm:
                                          ok3=await click(s,lease,'text='+confirm,high=True)
                                          action='payout_confirm'; effect=True; owner_error=owner_error or (not ok3)
                      elif login and not account:
                          # Authentication branch 1: existing Google session if provider exposes it.
                          google=await first_marker(s,lease,['Continue with Google','Sign in with Google','Log in with Google','Google'])
                          if google:
                              ok=await click(s,lease,'text='+google,high=False)
                              action='google_auth_attempt'; effect=True; owner_error=not ok
                          else:
                              # Authentication branch 2: browser-saved/autofilled credentials already in provider form.
                              ok=await click(s,lease,'button[type=submit]',high=False)
                              action='saved_credential_submit'; effect=True; owner_error=not ok
                      elif account:
                          action='authenticated_inventory_observed'

                      # Reconcile only coarse postcondition; never log lease, URL, DOM, credentials or balance amount.
                      after_cash=await first_marker(s,lease,spec['cashout'])
                      after_account=await first_marker(s,lease,spec['account'])
                      after_login=await first_marker(s,lease,spec['login'])
                      print(json.dumps({
                          'provider':spec['id'],
                          'provider_side_effect':effect,
                          'action':action,
                          'owner_error':owner_error,
                          'cashout_visible_before':bool(cashout),
                          'account_marker_before':bool(account),
                          'login_marker_before':bool(login),
                          'cashout_visible_after':bool(after_cash),
                          'account_marker_after':bool(after_account),
                          'login_marker_after':bool(after_login),
                          'authenticated_after':bool(after_account and not after_login),
                          'credentials_logged':False,
                          'navigation_performed':False,
                          'second_browser_started':False,
                      },sort_keys=True))
          asyncio.run(main())
          PY
