name: Cognilode CUX Prime Opinion saved-auth attempt

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cognilode-cux-qmee-observe.yml'

permissions:
  contents: read

jobs:
  prime:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'mcp==1.29.0'
      - name: Reuse current Prime Opinion CUX lease and try saved login once
        shell: bash
        run: |
          python - <<'PY'
          import asyncio,json
          from urllib.parse import urlparse
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          def decode(r):
              for p in r.content:
                  t=getattr(p,'text','')
                  if not t: continue
                  try:
                      o=json.loads(t); return o.get('result',o) if isinstance(o,dict) else o
                  except Exception: pass
              return {}
          def walk(o):
              if isinstance(o,dict):
                  yield o
                  for v in o.values(): yield from walk(v)
              elif isinstance(o,list):
                  for v in o: yield from walk(v)
          async def raw(s,op,args=None): return await s.call_tool('multi_tool',{'operation':op,'arguments':args or {}})
          async def call(s,op,args=None): return decode(await raw(s,op,args))
          def lease_of(sessions):
              rows=list(walk(sessions)); live99=any(str(r.get('display') or '')==':99' and (r.get('active') is True or r.get('alive') is True or str(r.get('state') or '').lower() in {'active','live','running'}) for r in rows)
              if not live99: raise RuntimeError('no live :99 application session')
              xs=[]
              for r in rows:
                  x=str(r.get('lease_id') or '').strip()
                  if x and x not in xs: xs.append(x)
              if len(xs)!=1: raise RuntimeError(f'expected one unique application lease, observed {len(xs)}')
              return xs[0]
          async def expect(s,lease,text):
              r=await raw(s,'computerusex.form.expect',{'lease_id':lease,'text':text,'wait_seconds':1.25})
              return not bool(getattr(r,'isError',False))

          async def main():
              async with streamable_http_client('https://mcp.cognilode.com/mcp') as (rd,wr,_):
                  async with ClientSession(rd,wr) as s:
                      await s.initialize()
                      sessions=await call(s,'computerusex.tools.sessions',{}); lease=lease_of(sessions)
                      windows=await call(s,'computerusex.tools.browser_windows',{})
                      prime=False
                      for r in walk(windows):
                          u=str(r.get('url') or '')
                          try: h=(urlparse(u).hostname or '').lower()
                          except Exception: h=''
                          if h=='primeopinion.com' or h.endswith('.primeopinion.com'): prime=True
                      if not prime:
                          print(json.dumps({'primeopinion_current':False,'login_submit_attempted':False,'reason':'provider_moved_before_effect'},sort_keys=True)); return
                      login=await expect(s,lease,'Log in')
                      rewards=await expect(s,lease,'Rewards')
                      attempted=False; submit_owner_error=False
                      if login and not rewards:
                          attempted=True
                          r=await raw(s,'computerusex.form.click',{'lease_id':lease,'selector':'button[type=submit]','effect_class':'final_submit','allow_submit':True,'allow_high_effect':False})
                          submit_owner_error=bool(getattr(r,'isError',False))
                      after_rewards=await expect(s,lease,'Rewards')
                      after_login=await expect(s,lease,'Log in')
                      authenticated=bool(after_rewards and not after_login)
                      print(json.dumps({'primeopinion_current':True,'login_surface_before':login,'rewards_before':rewards,'login_submit_attempted':attempted,'submit_owner_error':submit_owner_error,'authenticated_after_saved_login_attempt':authenticated,'provider_side_auth_attempt':attempted,'credentials_logged':False},sort_keys=True))
          asyncio.run(main())
          PY
