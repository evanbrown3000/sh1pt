name: Cognilode CUX minimal current-provider executor

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cognilode-cux-qmee-observe.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'mcp==1.29.0'
      - name: Execute one current-provider action with no navigation
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, json
          from urllib.parse import urlparse
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          SPECS={
              'qmee.com':('qmee','Cash out','Log in','My Qmee'),
              'primeopinion.com':('prime_opinion','Redeem','Log in','Rewards'),
              'fivesurveys.com':('five_surveys','Redeem','Log in','Complete 5 Surveys'),
              'freecash.com':('freecash','Cashout','Sign In','Earn'),
              'attapoll.app':('attapoll','','','Paid Surveys'),
          }

          def decode(r):
              for p in r.content:
                  t=getattr(p,'text','')
                  if not t: continue
                  try:
                      o=json.loads(t); return o.get('result',o) if isinstance(o,dict) else o
                  except Exception: pass
              return {}
          def walk(o):
              if isinstance(o,dict):
                  yield o
                  for v in o.values(): yield from walk(v)
              elif isinstance(o,list):
                  for v in o: yield from walk(v)
          async def raw(s,op,args=None): return await s.call_tool('multi_tool',{'operation':op,'arguments':args or {}})
          async def call(s,op,args=None): return decode(await raw(s,op,args))
          async def expect(s,lease,text):
              if not text: return False
              r=await raw(s,'computerusex.form.expect',{'lease_id':lease,'text':text,'wait_seconds':0.8})
              return not bool(getattr(r,'isError',False))
          async def effect_click(s,lease,selector,high):
              r=await raw(s,'computerusex.form.click',{'lease_id':lease,'selector':selector,'effect_class':'final_submit','allow_submit':True,'allow_high_effect':bool(high)})
              return not bool(getattr(r,'isError',False))
          def lease_of(sessions):
              rows=list(walk(sessions))
              if not any(str(r.get('display') or '')==':99' and (r.get('active') is True or r.get('alive') is True or str(r.get('state') or '').lower() in {'active','live','running'}) for r in rows):
                  raise RuntimeError('no live :99 application session; no second browser permitted')
              leases=[]
              for r in rows:
                  x=str(r.get('lease_id') or '').strip()
                  if x and x not in leases: leases.append(x)
              if len(leases)!=1: raise RuntimeError(f'expected one unique application lease, got {len(leases)}')
              return leases[0]
          def provider_of(windows):
              found={}
              for r in walk(windows):
                  u=str(r.get('url') or '')
                  try: h=(urlparse(u).hostname or '').lower()
                  except Exception: h=''
                  for d,spec in SPECS.items():
                      if h==d or h.endswith('.'+d): found[spec[0]]=spec
              if len(found)!=1: return None,len(found)
              return next(iter(found.values())),1

          async def one_attempt():
              mutated=False
              async with streamable_http_client('https://mcp.cognilode.com/mcp') as (rd,wr,_):
                  async with ClientSession(rd,wr) as s:
                      await s.initialize()
                      lease=lease_of(await call(s,'computerusex.tools.sessions',{}))
                      spec,count=provider_of(await call(s,'computerusex.tools.browser_windows',{}))
                      if spec is None:
                          return {'provider_count':count,'action':'none','provider_side_effect':False,'reason':'no_single_supported_current_provider'}
                      provider,cashout_label,login_label,account_label=spec
                      cashout=await expect(s,lease,cashout_label)
                      if cashout:
                          mutated=True
                          ok=await effect_click(s,lease,'text='+cashout_label,True)
                          return {'provider':provider,'action':'cashout_open','provider_side_effect':True,'owner_error':not ok,'effect_ambiguous':not ok,'credentials_logged':False,'navigation_performed':False,'second_browser_started':False}
                      login=await expect(s,lease,login_label)
                      if login:
                          mutated=True
                          ok=await effect_click(s,lease,'button[type=submit]',False)
                          result={'provider':provider,'action':'saved_credential_submit','provider_side_effect':True,'owner_error':not ok,'effect_ambiguous':not ok,'credentials_logged':False,'navigation_performed':False,'second_browser_started':False}
                          if ok:
                              # One postcondition read only after a successful owner receipt.
                              result['authenticated_after']=bool(await expect(s,lease,account_label))
                          return result
                      return {'provider':provider,'action':'no_cashout_or_login_marker','provider_side_effect':False,'effect_ambiguous':False,'credentials_logged':False,'navigation_performed':False,'second_browser_started':False}

          async def main():
              # Retry only connection/pre-effect failures. A mutating call is never auto-replayed.
              last=''
              for attempt in range(1,4):
                  try:
                      result=await one_attempt()
                      result['connection_attempt']=attempt
                      print(json.dumps(result,sort_keys=True))
                      return
                  except Exception as exc:
                      last=type(exc).__name__
                      if attempt<3:
                          await asyncio.sleep(2*attempt)
                          continue
              print(json.dumps({'provider_side_effect':False,'action':'none','reason':'mcp_pre_effect_unavailable','exception_type':last,'connection_attempts':3},sort_keys=True))
              raise SystemExit(70)
          asyncio.run(main())
          PY
