name: Cognilode CUX Qmee single-capture classify

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cognilode-cux-qmee-observe.yml'

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'mcp==1.29.0'
      - name: Classify current Qmee page from exact CUX tab capture
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, json, re
          from urllib.parse import urlparse
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          def parse_texts(result):
              out=[]
              for part in result.content:
                  text=getattr(part,'text','')
                  if not text: continue
                  try: out.append(json.loads(text))
                  except Exception: pass
              return out

          def walk(obj):
              if isinstance(obj,dict):
                  yield obj
                  for v in obj.values(): yield from walk(v)
              elif isinstance(obj,list):
                  for v in obj: yield from walk(v)

          def first_value(obj, key):
              for row in walk(obj):
                  value=row.get(key)
                  if value not in (None,''): return value
              return None

          async def call(session, op, args=None):
              r=await session.call_tool('multi_tool', {'operation':op,'arguments':args or {}})
              if bool(getattr(r,'isError',False)):
                  raise RuntimeError(f'{op} returned owner error')
              values=parse_texts(r)
              return values[0].get('result',values[0]) if values and isinstance(values[0],dict) else (values[0] if values else {})

          async def main():
              async with streamable_http_client('https://mcp.cognilode.com/mcp') as (read,write,_):
                  async with ClientSession(read,write) as s:
                      await s.initialize()
                      windows=await call(s,'computerusex.tools.browser_windows',{})
                      qmee=[]
                      for row in walk(windows):
                          u=str(row.get('url') or '')
                          tid=str(row.get('target_id') or '')
                          try: host=(urlparse(u).hostname or '').lower()
                          except Exception: host=''
                          if tid and (host=='qmee.com' or host.endswith('.qmee.com')):
                              qmee.append((tid,u))
                      uniq=[]
                      for item in qmee:
                          if item[0] not in {x[0] for x in uniq}: uniq.append(item)
                      if len(uniq)!=1:
                          raise RuntimeError(f'expected one exact live Qmee target, observed {len(uniq)}')
                      target_id=uniq[0][0]
                      capture=await call(s,'computerusex.tools.browser_tab_capture',{
                          'target_id':target_id,
                          'cdp_endpoint':'',
                          'output_dir':None,
                          'run_ocr':False,
                          'run_omniparser':False,
                          'ocr_provider':'auto',
                          'lang':'eng',
                      })
                      screenshot=str(first_value(capture,'screenshot_path') or '')
                      if not screenshot:
                          raise RuntimeError('Qmee exact tab capture returned no screenshot path')
                      analyzed=await call(s,'computerusex.tools.image',{
                          'image_path':screenshot,
                          'output_dir':None,
                          'run_ocr':True,
                          'run_omniparser':False,
                          'ocr_provider':'auto',
                          'lang':'eng',
                      })
                      # Search only in-memory tool response strings. Nothing private is logged.
                      strings=[]
                      for row in walk(analyzed):
                          for v in row.values():
                              if isinstance(v,str): strings.append(v)
                      text='\n'.join(strings).casefold()
                      login=bool(re.search(r'\blog in\b|log in to your account|forgot(?:ten)? password',text))
                      signup=bool(re.search(r'\bsign up\b|sign up for free',text))
                      cashout=bool(re.search(r'cash\s*out|cashout|withdraw',text))
                      balance=bool(re.search(r'your balance|balance\s*[:$]',text))
                      paypal='paypal' in text
                      venmo='venmo' in text
                      surveys='survey' in text
                      cashback='cashback' in text
                      deals=bool(re.search(r'\bdeals?\b',text))
                      gaming=bool(re.search(r'\bgaming\b|\bgames?\b',text))
                      account=any([cashout,balance,surveys,cashback,deals,gaming])
                      # Detect whether a visible dollar amount is at least $5, but never log amount.
                      amounts=[]
                      for raw in re.findall(r'\$\s*([0-9]+(?:\.[0-9]{1,2})?)',text):
                          try: amounts.append(float(raw))
                          except ValueError: pass
                      print(json.dumps({
                          'authenticated_qmee':bool(account and not login),
                          'login_surface_visible':login,
                          'signup_surface_visible':signup,
                          'cashout_visible':cashout,
                          'balance_label_visible':balance,
                          'visible_balance_or_reward_ge_5':any(x>=5.0 for x in amounts),
                          'paypal_visible':paypal,
                          'venmo_visible':venmo,
                          'survey_inventory_visible':surveys,
                          'cashback_visible':cashback,
                          'deals_visible':deals,
                          'gaming_visible':gaming,
                          'exact_qmee_target_count':1,
                          'navigation_replayed':False,
                          'private_page_content_logged':False,
                      },sort_keys=True))
          asyncio.run(main())
          PY
