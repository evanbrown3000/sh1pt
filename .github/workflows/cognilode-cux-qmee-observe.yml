name: Cognilode CUX Qmee observe

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cognilode-cux-qmee-observe.yml'

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'mcp==1.29.0'
      - name: Reuse one CUX application lease and classify Qmee state
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, json
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          def decode(result):
              texts=[getattr(p,'text','') for p in result.content if getattr(p,'text','')]
              for text in texts:
                  try:
                      obj=json.loads(text)
                      return obj.get('result', obj) if isinstance(obj,dict) else obj
                  except Exception:
                      continue
              return {}

          def walk(obj):
              if isinstance(obj,dict):
                  yield obj
                  for v in obj.values(): yield from walk(v)
              elif isinstance(obj,list):
                  for v in obj: yield from walk(v)

          async def raw(session, op, args=None):
              return await session.call_tool('multi_tool', {'operation':op,'arguments':args or {}})

          async def call(session, op, args=None):
              return decode(await raw(session,op,args))

          def pick_lease(sessions):
              candidates=[]
              for row in walk(sessions):
                  if str(row.get('display') or '') != ':99': continue
                  lease=str(row.get('lease_id') or '').strip()
                  if not lease: continue
                  live=(row.get('active') is True or row.get('alive') is True or str(row.get('state') or '').lower() in {'running','active','live'})
                  if live: candidates.append(lease)
              uniq=[]
              for x in candidates:
                  if x not in uniq: uniq.append(x)
              if len(uniq)!=1:
                  raise RuntimeError(f'expected exactly one live :99 application lease, observed {len(uniq)}')
              return uniq[0]

          async def expect(session, lease, text):
              try:
                  r=await raw(session,'computerusex.form.expect',{'lease_id':lease,'text':text,'wait_seconds':1.5})
                  # isError is authoritative; do not print page contents.
                  return not bool(getattr(r,'isError',False))
              except Exception:
                  return False

          async def main():
              async with streamable_http_client('https://mcp.cognilode.com/mcp') as (read, write, _):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      sessions=await call(session,'computerusex.tools.sessions')
                      lease=pick_lease(sessions)
                      nav=await raw(session,'computerusex.browser.goto',{
                          'lease_id':lease,
                          'url':'https://www.qmee.com/en-us',
                          'wait_seconds':8.0,
                          'expect_text':None,
                      })
                      if bool(getattr(nav,'isError',False)):
                          raise RuntimeError('Qmee navigation failed through existing CUX application lease')
                      markers={}
                      for text in ['My Qmee','Surveys','Cash out','Cashback','Deals','Log in to your account','Log in','Sign up for free','Sign Up']:
                          markers[text]=await expect(session,lease,text)
                      authenticated=(markers['My Qmee'] or markers['Surveys'] or markers['Cash out'] or markers['Cashback'] or markers['Deals']) and not markers['Log in to your account']
                      print(json.dumps({
                          'navigation_ok': True,
                          'authenticated_qmee': bool(authenticated),
                          'cashout_visible': bool(markers['Cash out']),
                          'survey_inventory_visible': bool(markers['Surveys']),
                          'cashback_visible': bool(markers['Cashback']),
                          'deals_visible': bool(markers['Deals']),
                          'login_surface_visible': bool(markers['Log in to your account'] or markers['Log in']),
                          'signup_surface_visible': bool(markers['Sign up for free'] or markers['Sign Up']),
                          'reused_existing_application_lease': True,
                      }, sort_keys=True))
          asyncio.run(main())
          PY
